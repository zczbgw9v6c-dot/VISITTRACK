<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VisitTrack — le suivi des visites techniques</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --fond:#F9F9F9; --carte:#FFFFFF; --trait:#E2E7E5;
  --encre:#1A2727; --encre-2:#3D4F4C; --encre-3:#778785;
  --vert:#4A9C85; --vert-clair:#8DC272; --vert-pale:#EAF3EC; --vert-fonce:#2F6E5D;
  --ambre:#8A6014; --ambre-pale:#FAF3E4; --ambre-trait:#EFE2C6;
  --rouge:#A23B2E; --rouge-pale:#FBEAE7;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Inter","Avenir Next",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--fond);color:var(--encre);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.02em}
h1{font-size:22px} h2{font-size:17px} h3{font-size:14.5px}
p{margin:0 0 10px}

/* transitions */
#view.sw{animation:swap .34s cubic-bezier(.2,.7,.2,1)}
@keyframes swap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#view.sw>*{animation:stag .4s cubic-bezier(.2,.7,.2,1) backwards}
#view.sw>*:nth-child(1){animation-delay:.02s}#view.sw>*:nth-child(2){animation-delay:.06s}#view.sw>*:nth-child(3){animation-delay:.1s}#view.sw>*:nth-child(4){animation-delay:.14s}#view.sw>*:nth-child(5){animation-delay:.18s}#view.sw>*:nth-child(n+6){animation-delay:.22s}
@keyframes stag{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sec{animation:none}
.ovl{animation:ovin .25s ease}
.ovl.closing{animation:ovout .22s ease forwards}
@keyframes ovin{from{background:rgba(26,39,39,0)}to{background:rgba(26,39,39,.42)}}
@keyframes ovout{to{background:rgba(26,39,39,0)}}
.pane{animation:slide .3s cubic-bezier(.2,.8,.2,1)}
.ovl.closing .pane{animation:slideout .22s ease forwards}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideout{to{transform:translateX(30px);opacity:0}}
.tab{transition:background .2s ease,color .2s ease,transform .15s ease}
.tab:active{transform:scale(.96)}
.it,.mc,.crow{transition:border-color .15s ease,background .15s ease,transform .12s ease}
.mc:active,.crow:active{transform:scale(.995)}
tbody tr{transition:background .12s ease}
.btn{transition:filter .15s ease,background .15s ease}
.toast{animation:tin .25s ease}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
/* cartes mobile */
.mc{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.mc.sel{background:var(--vert-pale);border-color:#CDE4DC}
.mc .who2{font-weight:600}
.mc .sub{font-size:12.5px;color:var(--encre-3)}
.mc .fi{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fab{display:none}

#gate,#app{transition:opacity .45s ease}
#gate.out{opacity:0;pointer-events:none}
#app.in{opacity:0}
.gbox{transform:translateY(6px);opacity:0;animation:rise .5s .05s ease forwards}
@keyframes rise{to{transform:none;opacity:1}}
.gbox.leaving{transition:transform .3s ease,opacity .3s ease;transform:translateY(-6px);opacity:0}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes rot{to{transform:rotate(360deg)}}
.audit{background:var(--ambre-pale);border:1px solid var(--ambre-trait);border-radius:var(--r);padding:14px 16px;margin-top:14px}
.audit h3{color:var(--ambre);margin-bottom:6px}
.audit .kv{grid-template-columns:150px 1fr;margin-top:10px}
/* connexion */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--encre)}
.gbox{background:var(--carte);border-radius:14px;padding:30px 28px;width:min(400px,100%)}
.gbox .logo{font-size:26px;margin-bottom:2px}
.gbox .tl{color:var(--encre-3);font-size:13.5px;margin-bottom:22px}
.gerr{color:var(--rouge);font-size:13px;margin-top:8px;min-height:18px}

/* menu latéral */
.burger{background:none;border:0;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:4px;border-radius:8px}
.burger:hover{background:var(--vert-pale)}
.burger span{display:block;width:18px;height:2px;background:var(--encre);border-radius:2px}
.dovl{position:fixed;inset:0;background:rgba(26,39,39,.42);z-index:90;animation:ovin .25s ease}
.dovl.closing{animation:ovout .2s ease forwards}
.dpane{width:min(320px,86%);height:100%;background:var(--carte);box-shadow:8px 0 30px rgba(26,39,39,.18);padding:20px 16px;display:flex;flex-direction:column;animation:dslide .3s cubic-bezier(.2,.8,.2,1);overflow:auto}
.dovl.closing .dpane{animation:dslideout .2s ease forwards}
@keyframes dslide{from{transform:translateX(-30px);opacity:.4}to{transform:none;opacity:1}}
@keyframes dslideout{to{transform:translateX(-24px);opacity:0}}
.dpane .dlogo{font-weight:700;font-size:19px;letter-spacing:-.02em;margin-bottom:2px}
.dpane .dlogo span{color:var(--vert)}
.dpane .dtl{font-size:12.5px;color:var(--encre-3);margin-bottom:20px}
.dlink{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:11px 12px;border-radius:9px;cursor:pointer;font-size:14.5px;color:var(--encre);transition:background .15s}
.dlink:hover{background:var(--vert-pale)}
.dlink.on{background:var(--encre);color:#fff;font-weight:600}
.dsep{height:1px;background:var(--trait);margin:12px 0}
.dfoot{margin-top:auto;font-size:12px;color:var(--encre-3);line-height:1.5;padding:12px 12px 0}
.page h2{margin:22px 0 8px}
.page p{font-size:14.5px;color:var(--encre-2);max-width:62ch}
.page ul{font-size:14.5px;color:var(--encre-2);max-width:62ch;padding-left:20px}
.page li{margin-bottom:5px}
/* shell */
.top{background:var(--carte);border-bottom:1px solid var(--trait);position:sticky;top:0;z-index:20}
.topin{max-width:1040px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px}
.logo{font-weight:700;letter-spacing:-.02em;font-size:17px}
.logo span{color:var(--vert)}
.tabs{display:flex;gap:2px;margin-left:8px}
.tab{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--encre-2);cursor:pointer;font-weight:500;white-space:nowrap}
.tab:hover{background:var(--vert-pale)}
.tab.on{background:var(--encre);color:#fff}
.tab .n{color:var(--encre-3);font-size:12px;margin-left:5px}
.tab.on .n{color:#B9CFC9}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--encre-3)}
.who b{color:var(--encre)}
.wrap{max-width:1040px;margin:0 auto;padding:20px 18px}

/* atoms */
.btn{background:var(--vert);color:#fff;border:0;border-radius:8px;padding:9px 15px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn.g{background:none;color:var(--encre);border:1px solid var(--trait)}
.btn.g:hover{background:var(--vert-pale);filter:none}
.btn.sm{padding:6px 11px;font-size:13.5px;font-weight:500}
.btn.d{background:none;color:var(--rouge);border:1px solid #E8C9C4}
.btn.w{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);padding:18px}
input[type=text],input[type=date],input[type=email],input[type=tel],input[type=number],input[type=password],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--trait);border-radius:8px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--vert);outline-offset:-1px;border-color:transparent}
label.f{display:block;font-size:12.5px;color:var(--encre-3);margin-bottom:4px}
.field{margin-bottom:12px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cols3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.seg{display:inline-flex;border:1px solid var(--trait);border-radius:8px;overflow:hidden}
.seg button{background:#fff;border:0;padding:8px 14px;cursor:pointer;color:var(--encre-2)}
.seg button.on{background:var(--encre);color:#fff;font-weight:600}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:5px;background:var(--fond);color:var(--encre-2);white-space:nowrap;border:1px solid var(--trait)}
.tag.a{background:var(--ambre-pale);color:var(--ambre);border-color:var(--ambre-trait)}
.tag.v{background:var(--vert-pale);color:var(--vert-fonce);border-color:#CDE4DC}
.tag.r{background:var(--rouge-pale);color:var(--rouge);border-color:#E8C9C4}
.mut{color:var(--encre-3)} .sm{font-size:13.5px} .xs{font-size:12px}
.empty{padding:40px 20px;text-align:center;color:var(--encre-3);border:1px dashed var(--trait);border-radius:var(--r);background:var(--carte)}
.empty b{display:block;color:var(--encre);margin-bottom:6px}
.hr{height:1px;background:var(--trait);border:0;margin:16px 0}
.stepn{display:flex;align-items:center;gap:10px;margin:22px 0 12px}
.stepn i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--encre);color:#fff;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;flex:0 0 24px}
.siretrow{display:flex;gap:8px;align-items:flex-end}
.siretmsg{font-size:12.5px;margin-top:5px;min-height:18px}
.siretmsg.ok{color:var(--vert-fonce)} .siretmsg.ko{color:var(--rouge)}

/* projet */
.hero{background:var(--encre);color:#fff;border-radius:14px;padding:30px 28px;margin-bottom:16px}
.hero h1{font-size:26px;color:#fff;margin-bottom:8px;max-width:640px}
.hero p{color:#B9CFC9;max-width:600px;font-size:15.5px}
.hero .big{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1;color:var(--vert-clair)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.step{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);padding:16px}
.step .k{font-size:12.5px;color:var(--vert);font-weight:600;margin-bottom:6px}
.step h3{margin-bottom:6px}
.step p{font-size:13.5px;color:var(--encre-2);margin:0}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.fact{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);padding:14px 16px;font-size:13.5px}
.fact b{display:block;margin-bottom:3px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.role{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);padding:14px 16px;font-size:13.5px}
.role b{display:block;margin-bottom:4px}
.role ul{margin:0;padding-left:16px;color:var(--encre-2)}

/* tableau des visites */
.tw{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;padding:9px 12px;color:var(--encre-3);font-weight:500;font-size:12.5px;border-bottom:1px solid var(--trait);white-space:nowrap;background:var(--carte);position:sticky;top:0;cursor:pointer;user-select:none}
th.s{color:var(--encre)}
td{padding:9px 12px;border-bottom:1px solid #F1F4F3;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:#F6F9F8}
tbody tr.sel{background:var(--vert-pale)}
td.ck,th.ck{width:34px;padding-right:0}
td .who2{font-weight:600}
td .sub{font-size:12px;color:var(--encre-3)}
.bulk{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--encre);color:#fff;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:13.5px}
.bulk .btn.g{color:#fff;border-color:#4A5F5C}
.bulk .btn.g:hover{background:#2C3E3B}
.more{text-align:center;padding:12px}
/* liste */
.lst{display:flex;flex-direction:column;gap:8px}
.it-old{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);padding:13px 16px;display:flex;gap:14px;align-items:center;cursor:pointer}
.it:hover{border-color:#C9D6D2}
.it .who2{font-weight:600}
.it .meta{font-size:13px;color:var(--encre-3);margin-top:1px}
.it .fi{margin-left:auto;text-align:right;min-width:150px}
.it .fi .c{font-weight:600;font-size:13.5px}
.it .fi .t{font-size:12px;color:var(--encre-3);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--vert-clair);flex:0 0 8px}
.dot.n{background:var(--trait)}

/* sélecteur de fiche */
.fpick{position:relative}
.fdrop{position:absolute;left:0;right:0;top:100%;z-index:30;background:#fff;border:1px solid var(--trait);border-radius:8px;max-height:280px;overflow:auto;box-shadow:0 10px 30px rgba(26,39,39,.12);margin-top:4px}
.fopt{padding:8px 11px;cursor:pointer;display:flex;gap:10px;align-items:baseline;border-bottom:1px solid #F1F4F3}
.fopt:hover,.fopt.hl{background:var(--vert-pale)}
.fopt b{font-size:13px;min-width:108px}
.fopt span{font-size:13px;color:var(--encre-2)}
.fsel{display:flex;align-items:center;gap:10px;background:var(--vert-pale);border:1px solid #CDE4DC;border-radius:8px;padding:9px 12px}
.fsel b{font-size:13.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{border:1px solid var(--trait);background:#fff;border-radius:999px;padding:3px 11px;font-size:12.5px;cursor:pointer;color:var(--encre-2)}
.chip.on{background:var(--encre);color:#fff;border-color:var(--encre)}

/* fichiers */
.drop{border:1.5px dashed #C9D6D2;border-radius:8px;padding:18px;text-align:center;color:var(--encre-3);cursor:pointer;background:#fff}
.drop:hover{border-color:var(--vert);background:var(--vert-pale)}
.files{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.file{display:flex;align-items:center;gap:10px;border:1px solid var(--trait);border-radius:8px;padding:7px 10px;font-size:13.5px;background:#fff}
.file .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{background:none;border:0;cursor:pointer;color:var(--encre-3);font-size:18px;line-height:1;padding:0 4px}

/* fiche client */
.sec{padding:14px 0;border-top:1px solid var(--trait)}
.sech{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sech h3{font-size:12.5px;color:var(--encre-3);font-weight:600;letter-spacing:.01em}
.sech .btn{margin-left:auto}
.note{background:var(--fond);border-radius:8px;padding:10px 12px;margin-top:10px;font-size:13.5px;white-space:pre-wrap}
.concl{background:#fff;border:1px solid var(--ambre-trait);border-radius:8px;padding:9px 12px;margin-top:10px;font-size:13.5px}
.pistes{display:flex;flex-direction:column;gap:6px}
.piste{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--trait);border-left:3px solid var(--vert);border-radius:8px;padding:9px 12px;background:#fff}
.piste b{font-size:13px;min-width:100px;padding-top:1px}
.hist{padding:6px 0;border-bottom:1px solid #F1F4F3}
.actions{display:flex;gap:10px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--trait);position:sticky;bottom:0;background:var(--carte);margin-top:6px;padding-bottom:4px}
.pane a{color:var(--vert);text-decoration:none}
.pane{overflow-wrap:anywhere}
/* panneau */
.ovl{position:fixed;inset:0;background:rgba(26,39,39,.42);z-index:80;display:flex;justify-content:flex-end}
.pane{background:var(--carte);width:min(620px,100%);height:100%;overflow:auto;padding:22px;box-shadow:-8px 0 30px rgba(26,39,39,.15)}
.pane header{display:flex;gap:12px;align-items:flex-start;margin-bottom:16px}
.kv{display:grid;grid-template-columns:minmax(110px,140px) 1fr;gap:7px 12px;font-size:14px}
.kv dd{min-width:0}
.kv dt{color:var(--encre-3)} .kv dd{margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--encre);color:#fff;padding:10px 16px;border-radius:8px;z-index:200;font-size:13.5px}

/* tuiles tableau de bord */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.tile2{background:var(--carte);border:1px solid var(--trait);border-radius:16px;padding:16px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;min-height:118px;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.tile2:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(26,39,39,.09);border-color:#C9D6D2}
.tile2:active{transform:scale(.98)}
.tile2 .v{font-size:32px;font-weight:700;letter-spacing:-.04em;line-height:1}
.tile2 .k{font-size:13px;color:var(--encre-2);font-weight:500;margin-top:8px;line-height:1.3}
.tile2 .s{font-size:11.5px;color:var(--encre-3);margin-top:2px}
.tile2.hi{background:var(--ambre-pale);border-color:var(--ambre-trait)} .tile2.hi .v{color:var(--ambre)}
.tile2.ok{background:var(--vert-pale);border-color:#CDE4DC} .tile2.ok .v{color:var(--vert-fonce)}
.tile2.al{background:var(--rouge-pale);border-color:#E8C9C4} .tile2.al .v{color:var(--rouge)}
.tile2.dark{background:var(--encre);border-color:var(--encre)} .tile2.dark .v{color:#fff} .tile2.dark .k{color:#C9DCD7} .tile2.dark .s{color:#8FA9A4}
.secth{display:flex;align-items:baseline;gap:10px;margin:4px 0 10px}
.secth h2{font-size:15px}
.secth span{font-size:12.5px;color:var(--encre-3)}
.spark{display:flex;align-items:flex-end;gap:3px;height:46px;margin-top:6px}
.spark i{flex:1;background:var(--vert);border-radius:2px 2px 0 0;min-height:2px;opacity:.85}
.spark i.last{background:var(--ambre);opacity:1}
.alert{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:8px;background:var(--rouge-pale);border:1px solid #E8C9C4;margin-bottom:8px;cursor:pointer}
.alert .d{margin-left:auto;font-size:12px;color:var(--rouge);font-weight:600;white-space:nowrap}
.rank{display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid #F1F4F3}
.rank .p{width:22px;height:22px;border-radius:50%;background:var(--fond);font-size:11.5px;display:flex;align-items:center;justify-content:center;color:var(--encre-3);flex:0 0 22px}
/* catalogue & stats */
.cat{display:grid;grid-template-columns:1fr;gap:4px}
.crow{display:flex;gap:12px;align-items:center;padding:8px 12px;border-radius:8px;background:var(--carte);border:1px solid var(--trait);cursor:pointer}
.crow:hover{border-color:#C9D6D2}
.crow b{min-width:112px;font-size:13.5px}
.crow span{flex:1;font-size:13.5px;color:var(--encre-2)}
.crow .n{font-size:12.5px;color:var(--encre-3);min-width:70px;text-align:right}
.crow .n.has{color:var(--vert);font-weight:600}
.maprow{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid #F1F4F3}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);padding:14px 16px}
.stat .v{font-size:26px;font-weight:600;letter-spacing:-.03em;line-height:1.15}
.stat .k{font-size:12.5px;color:var(--encre-3)}
.stat.tile{cursor:pointer;border-left:3px solid var(--trait);transition:border-color .15s,transform .15s}
.stat.tile:hover{border-color:var(--vert);transform:translateY(-1px)}
.stat.tile.hi{border-left-color:var(--ambre)} .stat.tile.hi .v{color:var(--ambre)}

function miniPDF(lines){
  const txt=lines.map((l,i)=>`BT /F1 ${i===0?14:10} Tf 50 ${770-i*18} Td (${l.replace(/[()\\]/g,'').replace(/[^\x20-\x7E]/g,'')}) Tj ET`).join('\n');
  const objs=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>','<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Contents 4 0 R /Resources << /Font << /F1 5 0 R >> >> >>',`<< /Length ${txt.length} >>\nstream\n${txt}\nendstream`,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>'];
  let out='%PDF-1.4\n',offs=[];
  objs.forEach((o,i)=>{offs.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`;});
  const x=out.length;
  out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`;
  return btoa(out);
}

async function chargerDemo(){
  const now=new Date(), iso=t=>new Date(t).toISOString().slice(0,10);
  for(const r of DEMO){
    const [type,rs,pre,nom,tel,email,adr,cp,ville,sect,fiche,off,tech,dos,etat,statut,resume,chauf,surf,bat,eq,pts,concl,opt={}]=r;
    const date=iso(now.getTime()+off*864e5);
    const v={id:uid(),createdAt:now.getTime()-Math.abs(off)*864e5,type,raison_sociale:rs,
      siret:type==='B2B'?String(Math.floor(1e13+Math.random()*9e13)):'',naf:'',prenom:pre,nom,tel,email,
      adresse:adr,cp,ville,dept:deptOf(cp),secteur:sect,fiche,date,technicien:tech,donneur_ordre:dos,
      notes:'',etat,statut,optout:!!opt.optout,saisi_par:'Confirmateur',files:[],suivi:[],demo:true};
    if(resume){
      const name='VT_'+(rs||nom).replace(/[^a-z0-9]/gi,'_')+'_'+date+'.pdf';
      const b64=miniPDF(['RAPPORT DE VISITE TECHNIQUE — '+fiche,'Client : '+(rs||pre+' '+nom),
        'Adresse : '+adr+', '+cp+' '+ville,'Date : '+date+'   Technicien : '+tech,'Donneur d ordre : '+dos,'',
        'Chauffage : '+chauf,'Surfaces : '+surf,'Batiment : '+bat,'Equipements : '+eq,'','Observations :',
        ...resume.split('. ').filter(Boolean).map(s=>' - '+s),'','Conclusion du technicien :',' '+concl]);
      const fid=uid();
      try{await Store.set(fk(fid),{b64,name,type:'application/pdf'});v.files.push({id:fid,name,size:Math.round(b64.length*0.75),type:'application/pdf'});}catch(e){}
      v.audit={resume,chauffage:chauf,surface:surf,batiment:bat,equipements:eq,points:pts,conclusion:concl,date,fichiers:1};
    }
    if(opt.histo)v.histoVT=opt.histo.map(x=>{
      const d=iso(now.getTime()+x.j*864e5).split('-').reverse().join('/');
      const chg=x.ancienne!==undefined?' (VT du '+iso(now.getTime()+x.ancienne*864e5).split('-').reverse().join('/')+' au '+date.split('-').reverse().join('/')+')':'';
      return d+' · '+x.de+' → '+x.vers+chg+(x.motif?' — '+x.motif:'')+' · Confirmateur';});
    if(opt.rappelEchu)v.rappel=iso(now.getTime()-(2+Math.floor(Math.random()*5))*864e5);
    if(opt.rappelFutur)v.rappel=iso(now.getTime()+opt.rappelFutur*864e5);
    if(statut!=='En attente')v.confirme_par=Math.random()<.5?'Bratan':'Amir';
    if(opt.note)v.suivi.push({d:iso(now.getTime()-Math.floor(3+Math.random()*12)*864e5),par:v.confirme_par||'Confirmateur',t:opt.note});
    if(statut==='Dossier signé')v.suivi.push({d:iso(now.getTime()-6*864e5),par:v.confirme_par||'Bratan',t:'Devis signé, dossier transmis à l\'obligé.'});
    visites.push(v);
  }
  await save();
}
async function retirerDemo(){
  for(const v of visites.filter(x=>x.demo))for(const f of(v.files||[]))await Store.del(fk(f.id));
  visites=visites.filter(x=>!x.demo);await save();
}

const Store=(()=>{const ws=typeof window!=='undefined'&&window.storage&&typeof window.storage.get==='function';return{
  async get(k){if(ws){try{const r=await window.storage.get(k);return r?JSON.parse(r.value):null;}catch(e){return null;}}try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}},
  async set(k,v){const s=JSON.stringify(v);if(ws){await window.storage.set(k,s);return;}try{localStorage.setItem(k,s);}catch(e){throw new Error('stockage indisponible');}},
  async del(k){if(ws){try{await window.storage.delete(k);}catch(e){}return;}localStorage.removeItem(k);}};})();

/* ---------- connexion ---------- */
function gate(){
  document.getElementById('app').style.display='none';
  const g=document.getElementById('gate');
  g.innerHTML=`<div class="gate"><div class="gbox">
    <div class="logo">Visit<span style="color:var(--vert)">Track</span></div>
    <div class="tl">Le suivi des visites techniques.</div>
    <div class="field"><label class="f">Identifiant</label><input type="text" id="gl" autocomplete="username" placeholder="VT-000" autocapitalize="characters"></div>
    <div class="field"><label class="f">Mot de passe</label><input type="password" id="gp" autocomplete="current-password"></div>
    <button class="btn w" id="gb">Se connecter</button>
    <div class="gerr" id="ge"></div>
  </div></div>`;
  const go=async()=>{
    const btn=document.getElementById('gb'); if(btn.disabled) return;
    const l=document.getElementById('gl').value.trim().toLowerCase(), p=document.getElementById('gp').value;
    document.getElementById('ge').textContent='';
    btn.disabled=true; btn.innerHTML='<span class="spin"></span>Connexion…';
    await new Promise(r=>setTimeout(r,650));
    const a=ACCES.find(x=>x.login.toLowerCase()===l&&x.mdp===p);
    if(!a){btn.disabled=false;btn.textContent='Se connecter';document.getElementById('ge').textContent='Identifiant ou mot de passe incorrect.';return;}
    user={login:a.login,nom:a.nom,role:a.role};
    btn.innerHTML='<span class="spin"></span>Bienvenue, '+esc(a.nom);
    await new Promise(r=>setTimeout(r,500));
    g.querySelector('.gbox').classList.add('leaving'); g.classList.add('out');
    await new Promise(r=>setTimeout(r,320));
    enter(true);
    try{await Store.set(KS,user);}catch(e){}
  };
  document.getElementById('gb').onclick=go;
  g.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')go();});
  setTimeout(()=>document.getElementById('gl').focus(),50);
}
function enter(anim){
  const g=document.getElementById('gate'), app=document.getElementById('app');
  g.innerHTML=''; g.classList.remove('out');
  document.getElementById('whoN').textContent=user.nom;
  document.getElementById('whoR').textContent='· '+ROLE_LABEL[user.role];
  view='tableau'; render();
  if(anim){ app.classList.add('in'); app.style.display=''; requestAnimationFrame(()=>requestAnimationFrame(()=>app.classList.remove('in'))); }
  else app.style.display='';
}
function gateOut(){ const app=document.getElementById('app'); app.classList.add('in'); setTimeout(()=>{app.style.display='none';app.classList.remove('in');gate();},450); }

/* ---------- sélecteur de fiche CEE ---------- */
function fichePicker(container,current,onPick){
  let val=current||'',sect='',hl=0;
  const draw=()=>{
    if(val){container.innerHTML=`<div class="fsel"><b>${esc(val)}</b><span class="sm">${esc(ficheTitre(val))}</span><button class="x" type="button" style="margin-left:auto">×</button></div>`;
      container.querySelector('.x').onclick=()=>{val='';onPick('');draw();setTimeout(()=>{const i=container.querySelector('input');if(i)i.focus();},0);};return;}
    container.innerHTML=`<div class="chips"><span class="chip ${sect===''?'on':''}" data-s="">Toutes</span>${Object.keys(SECT_LABEL).map(s=>`<span class="chip ${sect===s?'on':''}" data-s="${s}">${SECT_LABEL[s]}</span>`).join('')}</div>
      <div class="fpick"><input type="text" placeholder="Code (AGRI-EQ-110) ou mot de l'intitulé…" autocomplete="off"><div class="fdrop" style="display:none"></div></div>`;
    const inp=container.querySelector('input'),dd=container.querySelector('.fdrop');
    container.querySelectorAll('[data-s]').forEach(c=>c.onclick=()=>{sect=c.dataset.s;draw();container.querySelector('input').focus();});
    const list=t=>{t=t.trim().toLowerCase();const res=FICHES.filter(f=>(!sect||f[0].startsWith(sect+'-'))&&(!t||(f[0]+' '+f[1]).toLowerCase().includes(t))).slice(0,60);hl=0;
      dd.innerHTML=res.map((f,i)=>`<div class="fopt ${i===0?'hl':''}" data-c="${f[0]}"><b>${f[0]}</b><span>${esc(f[1])}</span></div>`).join('')||'<div class="fopt"><span class="mut">Aucune fiche</span></div>';
      dd.style.display='block';dd.querySelectorAll('[data-c]').forEach(o=>o.onmousedown=e=>{e.preventDefault();val=o.dataset.c;onPick(val);draw();});};
    inp.oninput=()=>list(inp.value);inp.onfocus=()=>list(inp.value);inp.onblur=()=>setTimeout(()=>dd.style.display='none',150);
    inp.onkeydown=e=>{const opts=[...dd.querySelectorAll('[data-c]')];if(!opts.length)return;
      if(e.key==='ArrowDown'){e.preventDefault();hl=Math.min(opts.length-1,hl+1);}else if(e.key==='ArrowUp'){e.preventDefault();hl=Math.max(0,hl-1);}
      else if(e.key==='Enter'){e.preventDefault();val=opts[hl].dataset.c;onPick(val);draw();return;}else return;
      opts.forEach((o,i)=>o.classList.toggle('hl',i===hl));opts[hl].scrollIntoView({block:'nearest'});};
  };
  draw();
}

/* ---------- SIRET → pré-remplissage (API Recherche d'entreprises, data.gouv, sans clé) ---------- */
async function chercherSiret(raw){
  const s=String(raw||'').replace(/\D/g,'');
  if(s.length!==9&&s.length!==14) throw new Error('Un SIRET fait 14 chiffres (ou 9 pour un SIREN).');
  const r=await fetch('https://recherche-entreprises.api.gouv.fr/search?q='+s+'&page=1&per_page=1');
  if(!r.ok) throw new Error('Service indisponible ('+r.status+').');
  const j=await r.json(); const e=(j.results||[])[0];
  if(!e) throw new Error('Aucune entreprise trouvée pour ce numéro.');
  const etab=(e.matching_etablissements||[]).find(x=>x.siret===s)||e.siege||{};
  const dir=(e.dirigeants||[]).find(d=>d.type_personne==='PP'||d.prenoms)||(e.dirigeants||[])[0]||{};
  return { raison:e.nom_complet||e.nom_raison_sociale||'', siret:etab.siret||(s.length===14?s:''), adresse:etab.adresse||'', cp:etab.code_postal||'', ville:etab.libelle_commune||'',
           naf:etab.activite_principale||e.activite_principale||'', prenom:(dir.prenoms||'').split(/[ ,]/)[0]||'', nom:dir.nom||'', qualite:dir.qualite||'', nature:e.nature_juridique||'' };
}


/* ---------- lecture du rapport par l'IA ---------- */
async function analyserRapport(v){
  const docs=[];
  for(const f of (v.files||[])){
    const d=await Store.get(fk(f.id)); if(!d) continue;
    const t=(d.type||'').toLowerCase();
    if(t==='application/pdf') docs.push({type:'document',source:{type:'base64',media_type:'application/pdf',data:d.b64}});
    else if(/^image\/(jpeg|png|webp|gif)$/.test(t)) docs.push({type:'image',source:{type:'base64',media_type:t,data:d.b64}});
  }
  if(!docs.length) throw new Error('Aucun PDF ni photo exploitable dans les fichiers joints.');
  const consigne=`Tu lis le rapport d'une visite technique réalisée chez un client dans le cadre des Certificats d'Économies d'Énergie (fiche ${v.fiche||'non précisée'}${ficheTitre(v.fiche)?' — '+ficheTitre(v.fiche):''}). Client : ${nomClient(v)}${v.secteur?', '+v.secteur:''}.
Réponds UNIQUEMENT par un objet JSON, sans texte autour ni balises, avec ces clés :
"resume": 3 à 5 phrases en français qui décrivent ce que le technicien a constaté chez ce client (bâtiment, activité, équipements, état, besoins) ;
"chauffage": énergie et système de chauffage (ex. "fioul, chaudière 2004") ou "" ;
"surface": surfaces relevées avec leur nature (ex. "maison 140 m², toiture 90 m²") ou "" ;
"batiment": type et caractéristiques du bâtiment (année, toiture, isolation) ou "" ;
"equipements": équipements comptés ou relevés (ex. "62 luminaires fluorescents, 3 splits") ou "" ;
"points": tableau de 2 à 6 courtes phrases : mesures importantes, contraintes, éléments utiles pour proposer d'autres opérations plus tard ;
"conclusion": l'avis ou la recommandation du technicien en 1 à 2 phrases, ou "".
Si une information n'est pas dans le rapport, laisse la chaîne vide. N'invente rien.`;
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:[...docs,{type:'text',text:consigne}]}]})});
  if(!r.ok) throw new Error('Lecture indisponible ('+r.status+').');
  const j=await r.json();
  const txt=(j.content||[]).map(c=>c.text||'').join('\n').replace(/```json|```/g,'').trim();
  let o; try{o=JSON.parse(txt.slice(txt.indexOf('{'),txt.lastIndexOf('}')+1));}catch(e){throw new Error('Réponse illisible, réessayez.');}
  return {resume:o.resume||'',chauffage:o.chauffage||'',surface:o.surface||'',batiment:o.batiment||'',equipements:o.equipements||'',points:Array.isArray(o.points)?o.points:[],conclusion:o.conclusion||'',date:new Date().toISOString().slice(0,10),fichiers:(v.files||[]).length};
}
function auditHTML(a){
  if(!a) return '';
  const kv=[['Chauffage',a.chauffage],['Surfaces',a.surface],['Bâtiment',a.batiment],['Équipements',a.equipements]].filter(x=>x[1]);
  return `<div class="audit"><div class="sm" style="white-space:pre-wrap;line-height:1.6">${esc(a.resume)}</div>
    ${kv.length?`<dl class="kv">${kv.map(([k,x])=>`<dt>${k}</dt><dd>${esc(x)}</dd>`).join('')}</dl>`:''}
    ${a.points&&a.points.length?`<div class="xs mut" style="margin-top:10px">Points relevés</div><ul class="sm" style="margin:2px 0 0;padding-left:18px">${a.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`:''}
    ${a.conclusion?`<div class="concl"><div class="xs mut">Conclusion du technicien</div>${esc(a.conclusion)}</div>`:''}
    <div class="xs mut" style="margin-top:8px">Lecture du rapport le ${fmtD(a.date)} — à vérifier avant usage.</div></div>`;
}

/* ---------- état de la VT et pistes de rappel ---------- */
function etatAuto(v){const t=new Date().toISOString().slice(0,10);if(v.files&&v.files.length)return 'Rapport reçu';if(!v.date)return 'Demandée';if(v.date>t)return 'Planifiée';if(v.date===t)return 'Technicien envoyé';return 'Effectuée';}
const vtEtatN=v=>v.etat||etatAuto(v);
const vtEtat=v=>({l:vtEtatN(v),c:ETAT_CLS[vtEtatN(v)]||''});
const estFaite=v=>['Effectuée','Rapport reçu','Non concluante'].includes(vtEtatN(v));
const estPrevue=v=>['Demandée','Planifiée','Technicien envoyé','Reportée'].includes(vtEtatN(v));
const rapportManquant=v=>vtEtatN(v)==='Effectuée'&&!(v.files&&v.files.length);
const joursDepuis=d=>d?Math.floor((Date.now()-new Date(d).getTime())/864e5):0;
function pistes(v){
  const a=v.audit||{};const txt=[a.resume,a.chauffage,a.surface,a.batiment,a.equipements,(a.points||[]).join(' '),a.conclusion,v.notes,v.secteur].join(' ').toLowerCase();
  const b2c=v.type==='B2C', agri=/^AGRI/.test(v.fiche||'')||/agric|forest|scierie|serre|maraîch|horti|élevage|elevage/.test(txt), dom=/^97/.test(v.cp||'');
  const out=[];const add=(code,why)=>{if(code!==v.fiche&&FMAP[code]&&!out.find(o=>o.code===code))out.push({code,why});};
  const tra=!b2c&&/flotte|tracteur routier|semi-remorque|transport routier|poids lourds et|^TRA/.test(txt+' '+(v.fiche||''));
  const ind=!b2c&&!agri&&!tra&&/^IND|usine|industrie|minoterie|métallerie|production/.test((v.fiche||'')+' '+txt);
  const comblesFaits=/isolés? (en )?20[12]\d|30 cm/.test(txt);
  const tert=!b2c&&!agri&&!ind&&!tra;
  if(/fioul|propane|gaz naturel|gaz —|chaudi.*(fioul|gaz)|fin de vie/.test(txt)&&!/chaudière (à )?(déchets de )?bois|bois déchiqueté|biomasse/.test(txt)){if(b2c){add('BAR-TH-171','Chaudière fioul ou gaz : pompe à chaleur air/eau');add('BAR-TH-113','Chaudière en fin de vie : biomasse granulés');}else if(agri)add('AGRI-TH-108','Chaufferie fossile : pompe à chaleur agricole');}
  if(b2c&&/comble|rampant/.test(txt)&&!comblesFaits)add(dom?'BAR-EN-106':'BAR-EN-101','Combles ou toiture insuffisamment isolés');
  if(b2c&&/murs? (parpaing |brique )?non isol/.test(txt))add(dom?'BAR-EN-107':'BAR-EN-102','Murs non isolés');
  if(tert&&/comble|toiture.*non isol/.test(txt))add(dom?'BAT-EN-106':'BAT-EN-101','Toiture du bâtiment non isolée');
  if(tert&&/toiture terrasse/.test(txt))add('BAT-EN-107','Toiture-terrasse : isolation');
  if(/split|climatis/.test(txt)){b2c?add('BAR-TH-129','Splits anciens : remplacement air/air'):(tert&&add('BAT-TH-122','Climatisation sans programmation'));}
  if(b2c&&/chauffe-eau|ecs|eau chaude/.test(txt)&&(dom||/sud|tôle|tole/.test(txt)))add('BAR-TH-101','Chauffe-eau électrique et toiture exposée : solaire');
  if(agri&&/séch|sech|scierie|bois/.test(txt))add('AGRI-EQ-110','Bâtiment de séchage et toiture exposée : solaire hybride');
  if(/serre/.test(txt)){add('AGRI-EQ-102','Serre : double écran thermique');add('AGRI-TH-119','Serre : hygrométrie élevée, déshumidification');}
  if(agri&&/groupe froid/.test(txt))add('AGRI-TH-104','Groupe froid : récupération de chaleur');
  if(ind&&/moteur|pompe|ventilateur|broyeur|élévateur/.test(txt))add('IND-UT-102','Moteurs sans variation de vitesse');
  if(ind&&/compresseur/.test(txt))add('IND-UT-103','Compresseurs d\'air : récupération de chaleur');
  if(ind&&/fuites|air comprimé/.test(txt))add('IND-UT-124','Air comprimé : séquenceur de centrale');
  if((ind||tra)&&/aérotherme/.test(txt))add('IND-BA-110','Grand volume chauffé par aérothermes : déstratification');
  if(tert&&/gtb|régulation|cta|centralis/.test(txt))add('BAT-TH-116','Pas de gestion technique centralisée');
  if(b2c&&/vmc|ventilation naturelle|condensation|aucune ventilation/.test(txt))add('BAR-TH-127','Absence de ventilation mécanique');
  if(/éclairage public|candélabre|point(s)? lumineux|sodium/.test(txt))add('RES-EC-104','Éclairage extérieur à rénover');
  if(tra){add('TRA-SE-104','Flotte de véhicules : station de gonflage');add('TRA-EQ-115','Renouvellement de flotte : véhicules optimisés');}
  return out.slice(0,4);
}

/* ---------- détail ---------- */
function detail(id){
  const v=visites.find(x=>x.id===id);if(!v)return;
  const m=document.getElementById('modal');const et=vtEtat(v);const ps=pistes(v);const a=v.audit;
  const sec=(t,body,extra)=>`<section class="sec"><div class="sech"><h3>${t}</h3>${extra||''}</div>${body}</section>`;
  const kv=rows=>`<dl class="kv">${rows.filter(r=>r[1]).map(([k,x])=>`<dt>${k}</dt><dd>${x}</dd>`).join('')}</dl>`;
  m.innerHTML=`<div class="ovl" id="ovl"><div class="pane" onclick="event.stopPropagation()">
    <header>
      <div style="min-width:0">
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px"><span class="tag ${et.c}">${et.l}${v.date?' · '+fmtD(v.date):''}</span><span class="tag">${v.type||'B2B'}</span>${v.optout?'<span class="tag r">Ne pas recontacter</span>':''}</div>
        <h2>${esc(nomClient(v))}</h2>
        <div class="sm mut">${esc([v.secteur,[v.cp,v.ville].filter(Boolean).join(' '),v.dept?'dépt '+v.dept:''].filter(Boolean).join(' · '))}</div>
      </div>
      <button class="x" id="cx" style="margin-left:auto">×</button>
    </header>

    ${sec('Client',kv([
      ['Interlocuteur',esc([v.prenom,v.nom].filter(Boolean).join(' '))],
      ['Téléphone',v.tel?`<a href="tel:${esc(v.tel)}">${esc(v.tel)}</a>`:''],
      ['E-mail',v.email?`<a href="mailto:${esc(v.email)}">${esc(v.email)}</a>`:''],
      ['Adresse',esc([v.adresse,[v.cp,v.ville].filter(Boolean).join(' ')].filter(Boolean).join(', '))],
      ['SIRET',esc(v.siret)],['Code NAF',esc(v.naf)],['Secteur',esc(v.secteur)]]))}

    ${sec('Visite technique',`${v.fiche?`<div class="fsel" style="margin-bottom:10px"><b>${esc(v.fiche)}</b><span class="sm">${esc(ficheTitre(v.fiche))}</span></div>`:'<div class="sm mut" style="margin-bottom:10px">Fiche CEE d\'origine non renseignée.</div>'}
      <div class="cols" style="margin-bottom:10px">
        <div><label class="f">État de la VT</label><select id="detat">${ETATS.map(s=>`<option ${vtEtatN(v)===s?'selected':''}>${s}</option>`).join('')}</select></div>
        <div><label class="f">Date de la VT</label><input type="date" id="ddate" value="${esc(v.date||'')}"></div>
      </div>
      ${rapportManquant(v)?'<div class="alert" style="margin-bottom:10px"><b class="sm">Rapport non joint</b><span class="d">VT effectuée il y a '+joursDepuis(v.date)+' j</span></div>':''}
      ${kv([['Technicien',esc(v.technicien)],['Donneur d\'ordre',esc(v.donneur_ordre)],['Saisie par',esc(v.saisi_par)],['Historique VT',(v.histoVT||[]).map(x=>esc(x)).join('<br>')]])}
      ${v.notes?`<div class="note"><div class="xs mut">Notes</div>${esc(v.notes)}</div>`:''}`)}

    ${sec('Synthèse du rapport',`<div id="auditzone">${a?auditHTML(a):'<div class="sm mut">Aucune synthèse. Joignez le rapport puis lancez la lecture.</div>'}</div>`,
      (v.files||[]).length?`<button class="btn g sm" id="bAudit">${a?'Relire':'Lire le rapport'}</button>`:'')}

    ${sec('Pistes de rappel',ps.length?`<div class="pistes">${ps.map(p=>`<div class="piste"><b>${p.code}</b><div><div class="sm">${esc(ficheTitre(p.code))}</div><div class="xs mut">${esc(p.why)}</div></div></div>`).join('')}</div><div class="xs mut" style="margin-top:8px">Suggestions déduites du rapport et de la fiche d'origine — à confirmer avec les critères de chaque fiche.</div>`:'<div class="sm mut">Aucune piste identifiée pour l\'instant. La lecture du rapport en fera apparaître.</div>')}

    ${sec('Rapport d\'audit',`<div class="files">${(v.files||[]).map(f=>`<div class="file"><span class="nm">${esc(f.name)}</span><span class="xs mut">${Math.round(f.size/1024)} Ko</span><button class="btn g sm" data-dl="${f.id}">Ouvrir</button></div>`).join('')||'<span class="sm mut">Aucun fichier joint.</span>'}</div>`)}

    ${sec('Suivi',`
      <div class="cols" style="margin-bottom:10px">
        <div><label class="f">Suivi commercial</label>${peutConfirmer()?`<select id="dstat">${STATUTS.map(s=>`<option ${(v.statut||'En attente')===s?'selected':''}>${s}</option>`).join('')}</select>`:`<span class="tag">${esc(v.statut||'En attente')}</span>`}</div>
        <div><label class="f">Prochain rappel</label>${peutConfirmer()?`<input type="date" id="drap" value="${esc(v.rappel||'')}">`:`<span class="sm">${fmtD(v.rappel)}</span>`}</div>
      </div>
      ${v.confirme_par?`<div class="xs mut" style="margin-bottom:8px">Dernière qualification par ${esc(v.confirme_par)}</div>`:''}
      ${peutConfirmer()?`<textarea id="dnote" rows="2" placeholder="Note d'appel…"></textarea><button class="btn g sm" id="dadd" style="margin-top:6px">Ajouter la note</button>`:''}
      <div class="sm" style="margin-top:8px">${(v.suivi||[]).slice().reverse().map(h=>`<div class="hist"><span class="xs mut">${fmtD(h.d)} · ${esc(h.par)}</span><div>${esc(h.t)}</div></div>`).join('')||'<span class="mut">Aucun échange enregistré.</span>'}</div>`)}

    <div class="actions">
      ${peutConfirmer()?'<button class="btn" id="bStat">Enregistrer le suivi</button>':''}
      <button class="btn g" id="bEdit">Modifier la fiche</button>
      <button class="btn g" id="bPrint">Imprimer</button>
      ${user.role==='direction'?'<button class="btn d" id="bDel" style="margin-left:auto">Supprimer</button>':''}
    </div>
  </div></div>`;
  document.getElementById('ovl').onclick=closeModal;document.getElementById('cx').onclick=closeModal;
  const on=(i,fn)=>{const e=document.getElementById(i);if(e)e.onclick=fn;};
  on('bEdit',()=>formVisite(id));
  on('bPrint',()=>window.print());
  on('bAudit',async()=>{const btn=document.getElementById('bAudit');btn.disabled=true;btn.innerHTML='<span class="spin" style="border-color:rgba(0,0,0,.2);border-top-color:var(--encre)"></span>Lecture…';
    try{v.audit=await analyserRapport(v);await save();closeModal();setTimeout(()=>detail(id),240);toast('Synthèse enregistrée');}
    catch(e){toast(e.message||'Lecture impossible');btn.disabled=false;btn.textContent=v.audit?'Relire':'Lire le rapport';}});
  on('bStat',async()=>{
    const ne=document.getElementById('detat').value, nd=document.getElementById('ddate').value, ae=vtEtatN(v), ad=v.date;
    if(ne!==ae||nd!==ad){
      if(ne==='Reportée'&&nd===ad){toast('Indiquez la nouvelle date de la VT');return;}
      let motif='';
      if(ne==='Annulée'||ne==='Non concluante'){motif=prompt(ne==='Annulée'?'Motif de l\'annulation :':'Pourquoi la VT n\'est pas concluante :')||'';}
      v.histoVT=v.histoVT||[];
      v.histoVT.push(fmtD(new Date().toISOString().slice(0,10))+' · '+ae+' → '+ne+(nd!==ad?' (VT du '+fmtD(ad)+' au '+fmtD(nd)+')':'')+(motif?' — '+motif:'')+' · '+user.nom);
      v.etat=ne; v.date=nd;
    }
    v.statut=document.getElementById('dstat').value;v.rappel=document.getElementById('drap').value;v.confirme_par=user.nom;v.updatedAt=Date.now();
    await save();closeModal();render();toast('Fiche enregistrée');});
  on('dadd',async()=>{const t=document.getElementById('dnote').value.trim();if(!t)return;v.suivi=v.suivi||[];v.suivi.push({d:new Date().toISOString().slice(0,10),par:user.nom,t});await save();closeModal();setTimeout(()=>detail(id),240);});
  on('bDel',async()=>{if(!confirm('Supprimer cette visite et ses fichiers ?'))return;for(const f of(v.files||[]))await Store.del(fk(f.id));visites=visites.filter(x=>x.id!==id);await save();closeModal();render();toast('Visite supprimée');});
  m.querySelectorAll('[data-dl]').forEach(b=>b.onclick=async()=>{const f=(v.files||[]).find(x=>x.id===b.dataset.dl);const d=await Store.get(fk(f.id));if(!d){toast('Fichier introuvable');return;}
    const bin=atob(d.b64),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);const url=URL.createObjectURL(new Blob([arr],{type:d.type||'application/octet-stream'}));
    const a=document.createElement('a');a.href=url;a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),4000);});
}
function closeModal(){const m=document.getElementById('modal'),o=m.querySelector('.ovl');if(!o){m.innerHTML='';return;}if(o.classList.contains('closing'))return;o.classList.add('closing');setTimeout(()=>{if(m.querySelector('.ovl')===o)m.innerHTML='';},230);}

/* ---------- import Excel / CSV ---------- */
const IMP_FIELDS=[['raison_sociale','Raison sociale'],['siret','SIRET'],['naf','Code NAF'],['prenom','Prénom'],['nom','Nom'],['tel','Téléphone'],['email','E-mail'],['adresse','Adresse'],['cp','Code postal'],['ville','Ville'],['secteur','Secteur d\'activité'],['fiche','Fiche CEE (code)'],['date','Date de la visite'],['technicien','Technicien'],['donneur_ordre','Donneur d\'ordre'],['notes','Notes']];
const IMP_RULES={raison_sociale:['raison','societe','société','entreprise','exploitation','enseigne','client'],siret:['siret','siren'],naf:['naf','ape'],prenom:['prenom','prénom'],nom:['nom'],tel:['tel','tél','phone','portable','mobile'],email:['mail','courriel'],adresse:['adresse','rue','voie'],cp:['cp','postal','zip'],ville:['ville','commune'],secteur:['secteur','activite','activité','filiere'],fiche:['fiche','operation','opération','cee','code'],date:['date','visite'],technicien:['technicien','intervenant'],donneur_ordre:['donneur','installateur','mandant'],notes:['note','observation','commentaire','remarque']};
let parsed=null;
function guessMap(h){const map={};h.forEach(c=>{const l=String(c).toLowerCase();for(const[f,keys]of Object.entries(IMP_RULES)){if(map[f])continue;if(keys.some(k=>l===k||l.includes(k))){map[f]=c;break;}}});return map;}
function showImport(){const z=document.getElementById('impzone');
  z.innerHTML=`<hr class="hr"><div class="drop" id="idrop">Déposer un fichier Excel ou CSV<br><span class="xs">première ligne = intitulés de colonnes</span></div><input type="file" id="ifile" accept=".xlsx,.xls,.csv" style="display:none"><div id="imap"></div>`;
  const d=document.getElementById('idrop');d.onclick=()=>document.getElementById('ifile').click();document.getElementById('ifile').onchange=e=>{if(e.target.files[0])parseFile(e.target.files[0]);};
  d.ondragover=e=>e.preventDefault();d.ondrop=e=>{e.preventDefault();if(e.dataTransfer.files[0])parseFile(e.dataTransfer.files[0]);};}
function parseFile(file){const r=new FileReader();r.onload=e=>{try{const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:false});if(!rows.length){toast('Fichier vide');return;}parsed={rows,headers:Object.keys(rows[0]),map:guessMap(Object.keys(rows[0])),name:file.name};drawMap();}catch(err){toast('Lecture impossible');}};r.readAsArrayBuffer(file);}
function drawMap(){const z=document.getElementById('imap');
  z.innerHTML=`<div class="sm" style="margin:12px 0 6px"><b>${esc(parsed.name)}</b> — ${parsed.rows.length} lignes. Vérifiez la correspondance des colonnes.</div>
    ${IMP_FIELDS.map(([k,l])=>`<div class="maprow"><span class="sm">${l}</span><select data-m="${k}"><option value="">— ignorer —</option>${parsed.headers.map(h=>`<option ${parsed.map[k]===h?'selected':''}>${esc(h)}</option>`).join('')}</select></div>`).join('')}
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:12px">
      <div style="flex:1;min-width:180px"><label class="f">Fiche CEE par défaut (si absente du fichier)</label><div id="ifp"></div></div>
      <div style="flex:1;min-width:160px"><label class="f">Donneur d'ordre par défaut</label><input type="text" id="ido"></div>
      <div><label class="f">Type</label><div class="seg" id="iseg"><button type="button" data-t="B2B" class="on">B2B</button><button type="button" data-t="B2C">B2C</button></div></div>
      <button class="btn" id="irun">Importer ${parsed.rows.length} visites</button></div>`;
  let defF='',itype='B2B';fichePicker(document.getElementById('ifp'),'',c=>defF=c);
  z.querySelectorAll('#iseg button').forEach(b=>b.onclick=()=>{itype=b.dataset.t;z.querySelectorAll('#iseg button').forEach(x=>x.classList.toggle('on',x===b));});
  z.querySelectorAll('[data-m]').forEach(s=>s.onchange=()=>parsed.map[s.dataset.m]=s.value);
  document.getElementById('irun').onclick=async()=>{const ido=document.getElementById('ido').value.trim();let n=0,skip=0;
    const seen=new Set(visites.flatMap(x=>[x.siret&&x.siret.replace(/\D/g,''),x.tel&&x.tel.replace(/\D/g,'')].filter(Boolean)));let dup=0;
    parsed.rows.forEach(row=>{const o={id:uid(),createdAt:Date.now(),type:itype,files:[],source:parsed.name,saisi_par:user.nom,statut:'En attente'};
      IMP_FIELDS.forEach(([k])=>{const c=parsed.map[k];o[k]=c?String(row[c]==null?'':row[c]).trim():'';});
      if(o.date){const d=new Date(o.date);if(!isNaN(d))o.date=d.toISOString().slice(0,10);}
      o.fiche=(o.fiche||'').toUpperCase().replace(/\s+/g,'');if(o.fiche&&!FMAP[o.fiche]){const hit=FICHES.find(f=>o.fiche.includes(f[0]));o.fiche=hit?hit[0]:o.fiche;}
      if(!o.fiche)o.fiche=defF;if(!o.donneur_ordre)o.donneur_ordre=ido;o.dept=deptOf(o.cp);
      if(!o.nom&&!o.raison_sociale&&!o.tel){skip++;return;}const ks=(o.siret||'').replace(/\D/g,''),kt=(o.tel||'').replace(/\D/g,'');if((ks&&seen.has(ks))||(kt&&seen.has(kt))){dup++;return;}if(ks)seen.add(ks);if(kt)seen.add(kt);visites.push(o);n++;});
    await save();parsed=null;render();toast(n+' visites importées'+(dup?' · '+dup+' doublons écartés':'')+(skip?' · '+skip+' lignes vides':''));};}

/* ---------- export ---------- */
function dl(name,content,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);}
function exportCSV(rows0,name){const cols=[['type','Type'],['raison_sociale','Raison sociale'],['siret','SIRET'],['naf','NAF'],['prenom','Prénom'],['nom','Nom'],['tel','Téléphone'],['email','E-mail'],['adresse','Adresse'],['cp','CP'],['ville','Ville'],['dept','Département'],['secteur','Secteur'],['fiche','Fiche CEE'],['ficheTitre','Intitulé'],['date','Date visite'],['technicien','Technicien'],['donneur_ordre','Donneur d\'ordre'],['statut','Statut'],['notes','Notes'],['optout','Ne pas recontacter']];
  const rows=(rows0||window._listeCourante()).map(v=>Object.assign({},v,{ficheTitre:ficheTitre(v.fiche),optout:v.optout?'oui':''}));
  dl(name||'visittrack-export.csv','\uFEFF'+cols.map(c=>c[1]).join(';')+'\n'+rows.map(r=>cols.map(c=>'"'+String(r[c[0]]==null?'':r[c[0]]).replace(/"/g,'""')+'"').join(';')).join('\n'),'text/csv');}

/* ---------- événements ---------- */
function bind(){
  document.querySelectorAll('[data-open]').forEach(e=>e.onclick=ev=>{if(ev.target.closest('.ck'))return;detail(e.dataset.open);});
  const on=(id,ev,fn)=>{const e=document.getElementById(id);if(e)e.addEventListener(ev,fn);};
  const keep=(id,setter)=>e=>{setter(e.target.value);shown=pageSize;const p=e.target.selectionStart;render();const n=document.getElementById(id);if(n){n.focus();n.setSelectionRange(p,p);}};
  on('q','input',keep('q',v=>q=v));on('cq','input',keep('cq',v=>catQ=v));
  on('ff','change',e=>{filtreFiche=e.target.value;shown=pageSize;render();});on('fe','change',e=>{filtreEtat=e.target.value;shown=pageSize;render();});on('ft','change',e=>{filtreTech=e.target.value;shown=pageSize;render();});on('fs','change',e=>{filtreStatut=e.target.value;shown=pageSize;render();});
  document.querySelectorAll('#view [data-t]').forEach(b=>{if(b.dataset.rep===undefined)b.onclick=()=>{filtreType=b.dataset.t;shown=pageSize;render();};});
  on('bImp','click',showImport);on('bExp','click',()=>exportCSV());
  document.querySelectorAll('[data-sort]').forEach(t=>t.onclick=()=>{if(sortKey===t.dataset.sort)sortDir=-sortDir;else{sortKey=t.dataset.sort;sortDir=1;}render();});
  on('bMore','click',()=>{shown+=pageSize;render();});
  document.querySelectorAll('[data-ck]').forEach(c=>c.onclick=e=>{e.stopPropagation();if(c.checked)sel.add(c.dataset.ck);else sel.delete(c.dataset.ck);render();});
  on('ckAll','click',e=>{e.stopPropagation();const l=window._listeCourante().slice(0,shown);if(e.target.checked)l.forEach(v=>sel.add(v.id));else l.forEach(v=>sel.delete(v.id));render();});
  on('bulkClr','click',()=>{sel.clear();render();});
  on('fclear','click',()=>{q='';filtreFiche='';filtreType='';filtreStatut='';filtrePeriode='';filtreEtat='';filtreTech='';shown=pageSize;render();});
  document.querySelectorAll('[data-tech]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();filtreTech=e.dataset.tech;filtrePeriode='';shown=pageSize;view='visites';render();});
  document.querySelectorAll('[data-rep]').forEach(e=>e.onclick=()=>{repVue=e.dataset.rep;render();});
  document.querySelectorAll('[data-per]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();filtrePeriode=e.dataset.per;filtreStatut=e.dataset.stat||'';shown=pageSize;view='visites';render();});
  on('bDemoOff','click',async()=>{if(!confirm('Retirer les visites de démonstration ?'))return;await retirerDemo();try{await Store.set(KD,'off');}catch(e){}render();toast('Démonstration retirée');});
  on('bDemoOn','click',async()=>{await chargerDemo();try{await Store.set(KD,'on');}catch(e){}render();toast('Démonstration chargée');});
  on('bulkExp','click',()=>exportCSV(visites.filter(v=>sel.has(v.id)&&!v.optout),'liste-appel.csv'));
  on('bulkStat','change',async e=>{const s=e.target.value;if(!s)return;visites.forEach(v=>{if(sel.has(v.id)){v.statut=s;v.confirme_par=user.nom;v.updatedAt=Date.now();}});await save();toast(sel.size+' visites → '+s);sel.clear();render();});
  on('bBkp','click',()=>dl('visittrack-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({visites},null,1),'application/json'));
  document.querySelectorAll('[data-cs]').forEach(c=>c.onclick=()=>{catSect=c.dataset.cs;render();});
  document.querySelectorAll('[data-cf]').forEach(c=>c.onclick=()=>{filtreFiche=c.dataset.cf;view='visites';render();});
}
document.getElementById('bMenu').onclick=openDrawer;
document.getElementById('bNew').onclick=()=>formVisite(null);
document.getElementById('bNewM').onclick=()=>formVisite(null);
let rsz;window.addEventListener('resize',()=>{clearTimeout(rsz);rsz=setTimeout(()=>{if(user&&view==='visites')render();},200);});
document.getElementById('bOut').onclick=async()=>{user=null;try{await Store.del(KS);}catch(e){}gateOut();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDrawer();}});
(async()=>{try{await load();}catch(e){}let s=null;try{s=await Store.get(KS);}catch(e){}if(s&&ACCES.find(a=>a.login===s.login)){user=s;enter();}else gate();})();
</script>
